<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After-School Lesson</title>
    <style>
        img { width: 300px; height: auto; }
    </style>
</head>
<body>
    <div id="app">
        <h1>{{ subject }}</h1>
        <p>Location: {{ location }}</p>
        <p>Price: {{ price }}</p>
        <img :src="image" :alt="imageAlt">
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script type="module">
        const {createApp} = Vue
        createApp({
            data() {
                return {
                    subject: 'Computer Science',
                    location: 'Hendon',
                    price: '£20',
                    image: 'images/lesson.jpg',
                    imageAlt: 'A student coding on a laptop'
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
