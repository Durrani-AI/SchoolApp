<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After-School Lessons</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <button @click="toggleCart" :disabled="numberOfItems === 0 && !displayCart">
            Checkout ({{ numberOfItems }})
        </button>

        <p v-if="confirmation">{{ confirmation }}</p>

        <div v-if="!displayCart">
            <p>
                <label>Sort by:
                    <select v-model="sortType">
                        <option value="price">Price</option>
                        <option value="availability">Availability</option>
                        <option value="location">Location</option>
                        <option value="subject">Subject</option>
                    </select>
                </label>
                <label><input type="radio" :value="true" v-model="sortAscending"> Ascending</label>
                <label><input type="radio" :value="false" v-model="sortAscending"> Descending</label>
            </p>
            <div v-for="lesson in sortedLessons" :key="lesson.id">
                <br>
                <h1>{{ lesson.subject }}</h1>
                <p>Location: {{ lesson.location }}</p>
                <p>Price: {{ lesson.price }}</p>
                <p>Spaces: {{ lesson.availability }}</p>
                <img :src="imageUrl(lesson.image)" :alt="lesson.subject">
                <br>
                <button @click="addToCart(lesson)" :disabled="!canAddToCart(lesson)">Add to cart</button>
            </div>
        </div>

        <div v-else>
            <h1>Checkout</h1>

            <div v-for="lesson in lessons" :key="lesson.id">
                <p v-if="countInCart(lesson.id) > 0">
                    {{ lesson.subject }} x {{ countInCart(lesson.id) }}
                    <button @click="removeFromCart(lesson)">Remove</button>
                </p>
            </div>

            <p>
                <label>Name: <input type="text" v-model="order.name"></label>
            </p>
            <p>
                <label>Telephone: <input type="text" v-model="order.telephone"></label>
            </p>
            <button @click="checkout" :disabled="!canCheckout">Checkout</button>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="Vue.js"></script>
</body>
</html>
